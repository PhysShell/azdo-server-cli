# cargo-deny config: licenses, security advisories, banned crates, sources.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Transitive-only advisories we cannot act on (all reach us solely through
# `ratatui`'s dependency tree) and which do not affect our usage:
ignore = [
    # `paste` is unmaintained (announcement only, no vulnerability).
    # Pulled by ratatui via compact_str/strum; no drop-in upgrade exists.
    "RUSTSEC-2024-0436",
    # `lru` IterMut Stacked-Borrows unsoundness. Used internally by
    # ratatui's buffer diff cache; we never touch `lru::IterMut`. Pinned
    # by ratatui 0.29; no patched release on its 0.12 line.
    "RUSTSEC-2026-0002",
]

[licenses]
version = 2
# Reasonable permissive set, plus the project's own WTFPL.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "WTFPL",
    "CDLA-Permissive-2.0",  # webpki-roots
    "Zlib",                 # foldhash (ratatui -> lru -> hashbrown); OSI-approved
]
confidence-threshold = 0.8
# Narrow, per-crate exceptions — the global allow-list stays permissive-only;
# copyleft is NOT allowed project-wide. Both arrive solely through `rhai`:
#   - smartstring (MPL-2.0): rhai's string type, structural — cannot be
#     feature-removed. MPL-2.0 is *file-level* copyleft: an unmodified
#     upstream dependency imposes no obligation on our code (we do not patch
#     smartstring). OSI + FSF approved.
#   - tiny-keccak (CC0-1.0): public-domain dedication, no obligations.
#     Reached via rhai -> ahash -> const-random -> tiny-keccak.
exceptions = [
    { allow = ["MPL-2.0"], crate = "smartstring" },
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
